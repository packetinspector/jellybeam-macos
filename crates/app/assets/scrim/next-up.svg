<svg xmlns="http://www.w3.org/2000/svg" width="550" height="310" viewBox="0 0 550 310">
  <!-- Next-up card scrim (docs/DESIGN-PLAYER-NAV.md §2.4): radial ellipse at 88% 88%, alpha 94% -> 82% at 38% -> 42% at 66% -> 0, with the top and left 64px multiplied down to nothing so the clipped ellipse leaves no seam. Rendered by GPUI as an alpha mask tinted NOTTE. -->
  <defs>
    <radialGradient id="g" cx="0.88" cy="0.88" r="0.88">
      <stop offset="0" stop-color="#fff" stop-opacity="0.94"/>
      <stop offset="0.38" stop-color="#fff" stop-opacity="0.82"/>
      <stop offset="0.66" stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.2065" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.1164" stop-color="#fff"/>
    </linearGradient>
    <mask id="mask-left"><rect width="550" height="310" fill="url(#left)"/></mask>
    <mask id="mask-edges"><rect width="550" height="310" fill="url(#top)" mask="url(#mask-left)"/></mask>
  </defs>
  <rect width="550" height="310" fill="url(#g)" mask="url(#mask-edges)"/>
</svg>
