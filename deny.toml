# cargo-deny configuration.
#
# Jellybeam is GPL-3.0-or-later; the allowlist below is the set of licenses
# actually present in the dependency tree today, all GPL-3.0-compatible
# (permissive or weak-copyleft). Anything new outside this list fails
# `cargo deny check` and gets a human look rather than silently shipping.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "GPL-3.0-or-later",
    # libfuzzer-sys (the fuzz workspace): (MIT OR Apache-2.0) AND NCSA --
    # NCSA is University of Illinois/NCSA, permissive, GPL-compatible.
    "NCSA",
    # webpki-roots: CDLA-Permissive-2.0 (Mozilla trust-store data), permissive.
    "CDLA-Permissive-2.0",
]

[advisories]
# Known advisories in the tree are transitive dependencies of gpui with no
# safe upgrade published (git2 is linked but unreachable: nothing here calls
# it). Keep the warnings visible rather than ignoring them here, so each run
# re-triages them.
yanked = "deny"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
